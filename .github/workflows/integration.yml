name: Run Sanity Tests on LambdaTest
on:
  workflow_dispatch:
jobs:
  sanity-test:
    runs-on: ubuntu-latest
    steps:
    - name: Trigger Sanity Test on LambdaTest
      shell: bash
      run: |
        echo "Triggering sanity tests on LambdaTest"
        response=$(curl --fail --show-error --silent \
          --location "https://test-manager-api.lambdatest.com/api/atm/v1/hyperexecute" \
          --header "Content-Type: application/json" \
          --header "Authorization: Basic YXJlZGFmb29kaWNzOkxUX2V3SEhVS3h0a3VWb0tsUWNBNkg4TzhOYnpWWXJDUFdYalJqd1FVZGxRNlJnMDhG" \
          --data '{
            "test_run_id": "01KGYRZFYCMMZ1PCVVG6BHYJBP",
            "concurrency": 1,
            "title": "integrationWithCI/CD"
          }')
        echo "Response: $response"
